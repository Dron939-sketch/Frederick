name: Sync to GitVerse and deploy to Amvera

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Зеркало — не деплой. 26.09.2026 gitverse.ru дважды ответил 502, шаг
      # упал, и до пуша в Amvera дело не дошло: два мержа (#693, #694) не
      # доехали до прода, а снаружи это выглядело как «сборка идёт».
      - name: Push to GitVerse (mirror main)
        continue-on-error: true
        env:
          GV_USER: ${{ secrets.GITVERSE_USER }}
          GV_PASS: ${{ secrets.GITVERSE_PASSWORD }}
          GV_PATH: ${{ secrets.GITVERSE_PATH }}
        run: |
          if [ -z "$GV_PATH" ]; then
            echo "GITVERSE_PATH not set — skipping GitVerse push"
            exit 0
          fi
          git push "https://${GV_USER}:${GV_PASS}@gitverse.ru/${GV_PATH}.git" \
            "refs/heads/main:refs/heads/main" --force

      # Пуш в git.msk0.amvera.ru убран 15.10.2026: регион Москва_0 у Amvera
      # лёг 11.10, проект бэкенда пересоздан как fffred
      # (fffred-ddd989.mia0.amvera.tech) с подключённым GitHub — Amvera сама
      # забирает main из этого репозитория. Старый шаг падал бы на каждом
      # мерже, пытаясь достучаться до мёртвого региона.
