name: Sync to GitVerse and deploy to Amvera

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Зеркало — не деплой. 26.09.2026 gitverse.ru дважды ответил 502, шаг
      # упал, и до пуша в Amvera дело не дошло: два мержа (#693, #694) не
      # доехали до прода, а снаружи это выглядело как «сборка идёт».
      - name: Push to GitVerse (mirror main)
        continue-on-error: true
        env:
          GV_USER: ${{ secrets.GITVERSE_USER }}
          GV_PASS: ${{ secrets.GITVERSE_PASSWORD }}
          GV_PATH: ${{ secrets.GITVERSE_PATH }}
        run: |
          if [ -z "$GV_PATH" ]; then
            echo "GITVERSE_PATH not set — skipping GitVerse push"
            exit 0
          fi
          git push "https://${GV_USER}:${GV_PASS}@gitverse.ru/${GV_PATH}.git" \
            "refs/heads/main:refs/heads/main" --force

      # Деплой бэкенда. 15.10.2026 пуш в git.msk0.amvera.ru убрали, решив, что
      # пересозданный проект fffred «сам забирает main с GitHub». Не забирал:
      # после переноса из Москва_0 вебхуки GitHub у Amvera отвалились («подключить
      # заново в разделе Репозиторий»), и каждая пересборка 15–20.10 поднимала
      # снимок кода примерно на 10–14.10 — /api/payment/diag (#739) и
      # /api/shop/checkout (#740) отвечали 404. Теперь код везём сами, как сайт:
      # main → master выделенного репозитория Amvera, этот пуш и запускает сборку.
      # amvera.yaml в репозитории совпадает с «Конфигурацией» в кабинете
      # (docker, Dockerfile, /data, 10000) — --force её не ломает.
      - name: Deploy to Amvera (fffred, mia0)
        env:
          AM_USER: ${{ secrets.AMVERA_USER }}
          AM_PASS: ${{ secrets.AMVERA_PASSWORD }}
        run: |
          if [ -z "$AM_USER" ] || [ -z "$AM_PASS" ]; then
            echo "::error::AMVERA_USER / AMVERA_PASSWORD не заданы — бэкенд не задеплоится"
            exit 1
          fi
          for attempt in 1 2 3; do
            if git push "https://${AM_USER}:${AM_PASS}@git.mia0.amvera.ru/ddd989/fffred" \
                 "refs/heads/main:refs/heads/master" --force; then
              exit 0
            fi
            echo "push attempt $attempt failed, retry in $((attempt*10))s"
            sleep $((attempt*10))
          done
          exit 1
